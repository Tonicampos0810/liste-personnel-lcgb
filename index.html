<title>Liste du personnel LCGB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Mise en page : une colonne centrée, deux grands onglets, un formulaire d'ajout, puis la liste. Pensé pour le doigt sur iPad. */
:root{
  --bg:#eef0f3;
  --card:#ffffff;
  --ink:#1b2430;
  --muted:#5d6877;
  --line:#d6dbe2;
  --accent:#009136;
  --accent-text:#00702d;
  --accent-ink:#ffffff;
  --accent-soft:#e0f3e7;
  --ok:#00702d;
  --ok-soft:#e0f3e7;
  --danger:#b3261e;
  --danger-soft:#fbe7e5;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171e;--card:#1b222c;--ink:#e8edf3;--muted:#9aa6b5;--line:#2c3644;
  --accent:#2bbf65;--accent-text:#6fdc9a;--accent-ink:#06210f;--accent-soft:#17301f;--ok:#6fdc9a;--ok-soft:#17301f;--danger:#f0857d;--danger-soft:#3a1f1e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e;--card:#1b222c;--ink:#e8edf3;--muted:#9aa6b5;--line:#2c3644;
  --accent:#2bbf65;--accent-text:#6fdc9a;--accent-ink:#06210f;--accent-soft:#17301f;--ok:#6fdc9a;--ok-soft:#17301f;--danger:#f0857d;--danger-soft:#3a1f1e;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.4;padding-inline:20px;padding-block:24px 48px}
main{max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header.brand{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 20px;border-bottom:4px solid var(--accent)}
.logo{height:72px;width:auto;flex:none}
@media (max-width:520px){.logo{height:52px}header.brand{gap:14px;padding:12px 14px}}
header.brand h1,header.brand .sub{color:#1b2430}
h1{font-family:var(--font-display);font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tab{min-height:64px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:600 20px var(--font-body);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.tab .n{font-variant-numeric:tabular-nums;background:var(--bg);color:var(--muted);border-radius:99px;padding:2px 12px;font-size:16px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.22);color:inherit}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-family:var(--font-display);font-size:22px;margin:0 0 14px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;align-items:end}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;color:var(--muted);min-width:0}
input[type=text],input[type=search],input[type=date]{width:100%;min-height:54px;padding:0 14px;font:400 18px var(--font-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:54px;padding:0 22px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 18px var(--font-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent-text)}
.actions{display:flex;gap:10px;grid-column:1/-1;flex-wrap:wrap}
.list-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.list-head input{flex:1 1 220px}
.rows{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.group{display:flex;align-items:center;gap:10px;margin-top:10px;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--accent-text)}
.group:first-child{margin-top:0}
.group .n{font:600 15px var(--font-body);background:var(--accent-soft);color:var(--accent-text);border-radius:99px;padding:1px 10px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.row.non{opacity:.75}
.row .main{min-width:0}
.row .name{font-weight:600;font-size:20px;overflow-wrap:anywhere}
.row .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--accent-soft);color:var(--accent-text);border-radius:8px;padding:3px 10px;font-size:16px;font-weight:500}
.chip.bureau{font-variant-numeric:tabular-nums}
.chip.date{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.non{background:var(--danger-soft);color:var(--danger)}
.decide{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btns{display:flex;gap:8px}
.small{min-height:48px;min-width:48px;padding:0 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px var(--font-body);cursor:pointer}
.small.del{color:var(--danger);border-color:var(--danger-soft)}
.small.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
.small.yes{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.small.no{color:var(--danger);border-color:var(--danger-soft)}
.small.no.on{background:var(--danger);border-color:var(--danger);color:#fff}
.empty{color:var(--muted);text-align:center;padding:28px 12px;margin:0}
.note{font-size:15px;color:var(--muted);margin:0}
.toast{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:12px;padding:12px 16px;font-weight:600}
@media (max-width:520px){.row{grid-template-columns:1fr}.row .btns{justify-content:flex-end}}
.print-head{display:none}
@page{margin:15mm}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--muted:#333;--line:#999;--accent:#009136;--accent-text:#00702d;--accent-soft:#e0f3e7;--danger:#b3261e;--danger-soft:#fff;--ok:#00702d;--ok-soft:#e0f3e7;color-scheme:light}
  body{background:#fff;color:#000;padding:0;font-size:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.brand{border:0;border-bottom:3pt solid #009136;border-radius:0;padding:0 0 8pt}
  .logo{height:44pt}
  h1{color:#000}
  header .sub,.tabs,.toast,.panel:first-of-type,.list-head,.note,.btns,.decide{display:none!important}
  main{max-width:none;gap:10pt}
  header.brand h1{font-size:20pt}
  .panel{border:0;padding:0;border-radius:0}
  .panel h2{display:none}
  .print-head{display:block;font:700 15pt var(--font-display);color:#00702d;margin:0 0 10pt}
  .row{display:block;padding:6pt 8pt;border:1px solid #bbb;border-left:4pt solid #009136;border-radius:0;break-inside:avoid;background:#fff}
  .row.non{opacity:1}
  .row .name{font-size:13pt}
  .chip{border:1px solid #009136;background:#e0f3e7;color:#00481d;font-size:11pt}
  .chip.non{border-color:#b3261e;background:#fbe7e5;color:#b3261e}
  .group{break-after:avoid;color:#00702d;font-size:14pt;margin-top:12pt;border-bottom:2px solid #009136;padding-bottom:2pt}
  .group .n{border:1px solid #009136;background:#e0f3e7;color:#00481d}
}
</style>

    <div>
      <h1>Liste du personnel LCGB</h1>
      <p class="sub">Les employés par secteur, leur fonction et leur numéro de bureau, puis les personnes à recruter.</p>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-emp" aria-selected="true">Employés <span class="n" id="n-emp">0</span></button>
    <button class="tab" role="tab" id="tab-rec" aria-selected="false">Recrutement <span class="n" id="n-rec">0</span></button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <section class="panel" aria-labelledby="form-title">
    <h2 id="form-title">Ajouter un employé</h2>
    <form id="form" autocomplete="off">
      <label for="f-nom">Nom
        <input type="text" id="f-nom" required enterkeyhint="next">
      </label>
      <label for="f-fonction"><span id="lbl-fonction">Fonction</span>
        <input type="text" id="f-fonction" required enterkeyhint="next">
      </label>
      <label for="f-secteur" id="wrap-secteur">Secteur
        <input type="text" id="f-secteur" list="secteurs" enterkeyhint="next">
        <datalist id="secteurs"></datalist>
      </label>
      <label for="f-bureau" id="wrap-bureau">N° de bureau
        <input type="text" id="f-bureau" enterkeyhint="done">
      </label>
      <label for="f-date" id="wrap-date">Date de l'entretien d'embauche
        <input type="date" id="f-date">
      </label>
      <div class="actions">
        <button type="submit" class="btn" id="btn-save">Ajouter</button>
        <button type="button" class="btn ghost" id="btn-cancel" hidden>Annuler</button>
      </div>
    </form>
  </section>

  <section class="panel" aria-labelledby="list-title">
    <h2 id="list-title">Liste des employés</h2>
    <p class="print-head" id="print-head"></p>
    <div class="list-head">
      <input type="search" id="q" placeholder="Rechercher un nom, une fonction…" aria-label="Rechercher">
      <button type="button" class="btn ghost" id="btn-print">Imprimer en PDF</button>
    </div>
    <ul class="rows" id="rows"></ul>
    <p class="note" id="note">Les données sont enregistrées sur cet appareil uniquement.</p>
  </section>
</main>

<script>
(function(){
  var TABS = {
    emp: {add:"Ajouter un employé", list:"Liste des employés", fn:"Fonction",
          empty:"Aucun employé pour l'instant. Remplissez le formulaire ci-dessus pour ajouter le premier."},
    rec: {add:"Ajouter une personne à recruter", list:"Liste du recrutement", fn:"Poste visé",
          empty:"Aucune personne à recruter pour l'instant. Remplissez le formulaire ci-dessus pour ajouter la première."}
  };
  var SANS = "Sans secteur";
  var cur = "emp";
  var data = {emp:[], rec:[]};
  var editing = null;
  var pendingDel = null;
  var toastTimer = null;

  var $ = function(id){return document.getElementById(id)};
  var form=$("form"), fNom=$("f-nom"), fFn=$("f-fonction"), fSec=$("f-secteur"), fBur=$("f-bureau"), fDate=$("f-date"), rows=$("rows");

  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return []}}
  function persist(){
    try{localStorage.setItem("emp",JSON.stringify(data.emp)); localStorage.setItem("rec",JSON.stringify(data.rec));}
    catch(e){showNote("Enregistrement impossible sur cet appareil.",true)}
  }
  function showNote(m,bad){var n=$("note"); n.textContent=m; n.style.color=bad?"var(--danger)":""}
  function toast(m){
    var t=$("toast"); t.textContent=m; t.hidden=false;
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.hidden=true},6000);
  }
  function fmtDate(iso){
    if(!iso) return "";
    var p=iso.split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso;
  }
  function newId(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function byName(a,b){return a.nom.localeCompare(b.nom,"fr")}
  function el(tag,cls,txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e}

  function updateSecteurs(){
    var seen={}, dl=$("secteurs"); dl.textContent="";
    data.emp.forEach(function(r){var s=(r.secteur||"").trim(); if(s && !seen[s.toLowerCase()]){seen[s.toLowerCase()]=1; var o=document.createElement("option"); o.value=s; dl.appendChild(o);}});
  }

  function deleteButton(r){
    var del=el("button","small del");
    if(pendingDel===r.id){
      del.classList.add("confirm"); del.textContent="Confirmer";
      del.onclick=function(){remove(r.id)};
    } else {
      del.textContent="Supprimer";
      del.onclick=function(){
        pendingDel=r.id; render();
        setTimeout(function(){if(pendingDel===r.id){pendingDel=null; render()}},4000);
      };
    }
    return del;
  }

  function empRow(r){
    var li=el("li","row");
    var main=el("div","main");
    main.appendChild(el("div","name",r.nom));
    var meta=el("div","meta");
    meta.appendChild(el("span","chip",r.fonction));
    if(r.bureau) meta.appendChild(el("span","chip bureau","Bureau "+r.bureau));
    main.appendChild(meta);
    var b=el("div","btns");
    var ed=el("button","small","Modifier"); ed.onclick=function(){startEdit(r)};
    b.appendChild(ed); b.appendChild(deleteButton(r));
    li.appendChild(main); li.appendChild(b);
    return li;
  }

  function recRow(r){
    var li=el("li","row"+(r.statut==="non"?" non":""));
    var main=el("div","main");
    main.appendChild(el("div","name",r.nom));
    var meta=el("div","meta");
    meta.appendChild(el("span","chip",r.fonction));
    if(r.date) meta.appendChild(el("span","chip date","Entretien : "+fmtDate(r.date)));
    if(r.statut==="non") meta.appendChild(el("span","chip non","Non embauché"));
    main.appendChild(meta);
    var d=el("div","decide");
    var yes=el("button","small yes","Embauché"); yes.onclick=function(){hire(r.id)};
    var no=el("button","small no"+(r.statut==="non"?" on":""),"Non embauché"); no.onclick=function(){declineHire(r.id)};
    d.appendChild(yes); d.appendChild(no);
    main.appendChild(d);
    var b=el("div","btns");
    var ed=el("button","small","Modifier"); ed.onclick=function(){startEdit(r)};
    b.appendChild(ed); b.appendChild(deleteButton(r));
    li.appendChild(main); li.appendChild(b);
    return li;
  }

  function render(){
    var t = TABS[cur], q = $("q").value.trim().toLowerCase(), isEmp = cur==="emp";
    $("n-emp").textContent = data.emp.length;
    $("n-rec").textContent = data.rec.length;
    $("form-title").textContent = editing ? "Modifier la fiche" : t.add;
    $("list-title").textContent = t.list;
    $("lbl-fonction").textContent = t.fn;
    $("wrap-bureau").hidden = !isEmp;
    $("wrap-secteur").hidden = !isEmp;
    $("wrap-date").hidden = isEmp;
    $("btn-save").textContent = editing ? "Enregistrer" : "Ajouter";
    $("btn-cancel").hidden = !editing;
    $("tab-emp").setAttribute("aria-selected", isEmp);
    $("tab-rec").setAttribute("aria-selected", !isEmp);
    $("q").placeholder = isEmp ? "Rechercher un nom, une fonction, un secteur…" : "Rechercher un nom, un poste…";
    updateSecteurs();

    var list = data[cur].slice();
    if(q) list = list.filter(function(r){
      return (r.nom+" "+r.fonction+" "+(r.bureau||"")+" "+(r.secteur||"")).toLowerCase().indexOf(q)>-1;
    });
    rows.textContent = "";
    if(!list.length){
      rows.appendChild(el("li","empty", q ? "Aucun résultat pour cette recherche." : t.empty));
      return;
    }

    if(isEmp){
      var groups={}, order=[];
      list.forEach(function(r){
        var s=(r.secteur||"").trim()||SANS, k=s.toLowerCase();
        if(!groups[k]){groups[k]={name:s,items:[]}; order.push(k)}
        groups[k].items.push(r);
      });
      order.sort(function(a,b){
        if(groups[a].name===SANS) return 1;
        if(groups[b].name===SANS) return -1;
        return groups[a].name.localeCompare(groups[b].name,"fr");
      });
      order.forEach(function(k){
        var g=groups[k], h=el("li","group");
        h.appendChild(el("span",null,g.name)); h.appendChild(el("span","n",String(g.items.length)));
        rows.appendChild(h);
        g.items.sort(byName).forEach(function(r){rows.appendChild(empRow(r))});
      });
    } else {
      list.sort(function(a,b){
        if(a.date&&b.date&&a.date!==b.date) return a.date<b.date?-1:1;
        if(a.date&&!b.date) return -1;
        if(!a.date&&b.date) return 1;
        return byName(a,b);
      }).forEach(function(r){rows.appendChild(recRow(r))});
    }
  }

  function resetForm(){editing=null; form.reset();}
  function startEdit(r){
    editing=r.id; fNom.value=r.nom; fFn.value=r.fonction;
    fSec.value=r.secteur||""; fBur.value=r.bureau||""; fDate.value=r.date||"";
    render(); form.scrollIntoView({behavior:"smooth",block:"center"}); fNom.focus();
  }

  function upsert(key,rec){
    var arr=data[key], i=arr.findIndex(function(x){return x.id===rec.id});
    if(i>-1) arr[i]=rec; else arr.push(rec);
  }
  function remove(id){
    pendingDel=null;
    data[cur]=data[cur].filter(function(x){return x.id!==id});
    persist(); render();
  }

  function hire(id){
    var r=data.rec.find(function(x){return x.id===id}); if(!r) return;
    data.rec=data.rec.filter(function(x){return x.id!==id});
    data.emp.push({id:newId(), nom:r.nom, fonction:r.fonction, secteur:"", bureau:""});
    persist(); cur="emp"; resetForm(); $("q").value=""; render();
    toast(r.nom+" est maintenant dans la liste des employés. Touchez « Modifier » pour ajouter le secteur et le bureau.");
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function declineHire(id){
    var r=data.rec.find(function(x){return x.id===id}); if(!r) return;
    r.statut = r.statut==="non" ? "" : "non";
    persist(); render();
  }

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var nom=fNom.value.trim(), fn=fFn.value.trim();
    if(!nom||!fn) return;
    var id = editing || newId(), rec;
    if(cur==="emp"){
      rec={id:id, nom:nom, fonction:fn, secteur:fSec.value.trim(), bureau:fBur.value.trim()};
    } else {
      var old = editing ? data.rec.find(function(x){return x.id===editing}) : null;
      rec={id:id, nom:nom, fonction:fn, date:fDate.value||"", statut:old?old.statut||"":""};
    }
    upsert(cur,rec); persist(); resetForm(); render(); fNom.focus();
  });
  $("btn-print").onclick=function(){
    var d=new Date(), p=function(n){return (n<10?"0":"")+n};
    $("print-head").textContent = TABS[cur].list+" — "+p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();
    try{window.print()}catch(e){showNote("Impression impossible ici. Ouvrez la page dans Safari.",true)}
  };
  $("btn-cancel").onclick=function(){resetForm(); render()};
  $("q").addEventListener("input", render);
  function setTab(k){cur=k; resetForm(); pendingDel=null; $("q").value=""; $("toast").hidden=true; render();}
  $("tab-emp").onclick=function(){setTab("emp")};
  $("tab-rec").onclick=function(){setTab("rec")};

  data.emp=lsGet("emp"); data.rec=lsGet("rec");
  render();
})();
</script>
</body>
</html>
